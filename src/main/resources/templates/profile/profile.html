<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head('Hồ sơ cá nhân','dashboard.css')}"></head>

<body>

<div class="layout">

    <div th:replace="~{fragments/sidebar :: sidebar(${user.role.name()})}"></div>

    <div class="main-content">

        <div th:replace="~{fragments/navbar :: navbar('Hồ sơ cá nhân')}"></div>

        <div class="content">

            <h1>Hồ sơ cá nhân</h1>

            <div th:if="${param.saved}" class="badge badge-success">
                Cập nhật hồ sơ thành công
            </div>

            <form class="form-card"
                  th:action="@{/{role}/profile/save(role=${#strings.toLowerCase(user.role.name())})}"
                  method="post"
                  th:object="${profile}">

                <input type="hidden" th:field="*{id}">

                <div class="form-group">
                    <label class="form-label">Tên đăng nhập</label>
                    <input class="form-input"
                           type="text"
                           th:value="${user.username}"
                           readonly>
                </div>

                <div class="form-group">
                    <label class="form-label">Email</label>
                    <input class="form-input"
                           type="email"
                           th:value="${user.email}"
                           readonly>
                </div>

                <div class="form-group">
                    <label class="form-label">Họ tên</label>
                    <input class="form-input"
                           type="text"
                           th:field="*{fullName}"
                           placeholder="Nhập họ tên">
                    <span class="text-danger" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></span>
                </div>

                <div class="form-group">
                    <label class="form-label">Số điện thoại</label>
                    <input class="form-input"
                           type="text"
                           th:field="*{phone}"
                           placeholder="Nhập số điện thoại">
                    <span class="text-danger" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></span>
                </div>

                <div class="form-group">
                    <label class="form-label">Địa chỉ</label>
                    <input class="form-input"
                           type="text"
                           th:field="*{address}"
                           placeholder="Nhập địa chỉ">
                    <span class="text-danger" th:if="${#fields.hasErrors('address')}" th:errors="*{address}"></span>
                </div>

                <div class="form-group">
                    <label class="form-label">Ngày sinh</label>
                    <input class="form-input"
                           type="date"
                           th:field="*{dateOfBirth}">
                    <span class="text-danger" th:if="${#fields.hasErrors('dateOfBirth')}" th:errors="*{dateOfBirth}"></span>
                </div>

                <div class="form-group">
                    <label class="form-label">Giới tính</label>
                    <select class="form-input" th:field="*{gender}">
                        <option value="">-- Chọn giới tính --</option>
                        <option value="MALE">Nam</option>
                        <option value="FEMALE">Nữ</option>
                        <option value="OTHER">Khác</option>
                    </select>
                    <span class="text-danger" th:if="${#fields.hasErrors('gender')}" th:errors="*{gender}"></span>
                </div>

                <button class="submit-btn" type="submit">
                    Lưu hồ sơ
                </button>

            </form>

        </div>

        <div th:replace="~{fragments/footer :: footer}"></div>

    </div>

</div>

</body>
</html>
