<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head('Form thuốc','dashboard.css')}"></head>

<body>

<div class="layout">

  <div th:replace="~{fragments/sidebar :: sidebar('ADMIN')}"></div>

  <div class="main-content">

    <div th:replace="~{fragments/navbar :: navbar('Form thuốc')}"></div>

    <div class="content">

      <form class="form-card"
            th:action="@{/admin/medicines/save}"
            method="post"
            th:object="${medicine}">

        <input type="hidden" th:field="*{id}">

        <div class="form-group">

          <label class="form-label">
            Tên thuốc
          </label>

          <input class="form-input"
                 type="text"
                 th:field="*{name}"
                 placeholder="Nhập tên thuốc..."
                 required>

        </div>

        <div class="form-group">

          <label class="form-label">
            Đơn vị
          </label>

          <input class="form-input"
                 type="text"
                 th:field="*{unit}"
                 placeholder="Ví dụ: Viên, Chai..."
                 required>

        </div>

        <div class="form-group">

          <label class="form-label">
            Số lượng tồn kho
          </label>

          <input class="form-input"
                 type="number"
                 th:field="*{quantity}"
                 placeholder="Nhập số lượng..."
                 required>

        </div>

        <div class="form-group">

          <label class="form-label">
            Giá thuốc
          </label>

          <input class="form-input"
                 type="number"
                 step="0.01"
                 th:field="*{price}"
                 placeholder="Nhập giá thuốc...">

        </div>

        <div class="form-group">

          <label class="form-label">
            Mô tả thuốc
          </label>

          <textarea class="form-textarea"
                    th:field="*{description}"
                    placeholder="Nhập mô tả thuốc...">
                    </textarea>

        </div>

        <button class="submit-btn" type="submit">
          Lưu thuốc
        </button>

      </form>

    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>

  </div>

</div>

</body>
</html>
