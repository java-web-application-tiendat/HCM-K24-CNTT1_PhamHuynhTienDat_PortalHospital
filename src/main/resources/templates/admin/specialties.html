<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head('Danh mục chuyên khoa','dashboard.css')}"></head>

<body>
<div class="layout">

    <div th:replace="~{fragments/sidebar :: sidebar('ADMIN')}"></div>

    <div class="main-content">

        <div th:replace="~{fragments/navbar :: navbar('Danh mục chuyên khoa')}"></div>

        <div class="content">

            <h1>Danh mục chuyên khoa</h1>

            <table>
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Tên chuyên khoa</th>
                    <th>Mô tả</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="s : ${specialties}">
                    <td th:text="${s.id}"></td>
                    <td th:text="${s.name}"></td>
                    <td th:text="${s.description}"></td>
                </tr>
                </tbody>
            </table>

        </div>

        <div th:replace="~{fragments/footer :: footer}"></div>

    </div>
</div>
</body>
</html>
