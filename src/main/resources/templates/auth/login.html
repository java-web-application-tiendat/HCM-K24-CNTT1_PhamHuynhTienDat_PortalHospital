<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head('Đăng nhập', 'auth.css')}"></head>

<body>

<div class="auth-card">

    <div class="logo">+</div>

    <h2>Đăng nhập</h2>

    <p class="subtitle">
        Truy cập hệ thống bệnh viện
    </p>


    <!-- ========================= -->
    <!-- ĐĂNG KÝ THÀNH CÔNG -->
    <!-- ========================= -->
    <div class="alert success"
         th:if="${param.registered}">

        Đăng ký thành công.

    </div>


    <!-- ========================= -->
    <!-- LOGIN FAIL -->
    <!-- ========================= -->
    <div class="alert error"
         th:if="${param.error}">

        Sai tài khoản hoặc mật khẩu.

    </div>


    <!-- ========================= -->
    <!-- LOGOUT -->
    <!-- ========================= -->
    <div class="alert success"
         th:if="${param.logout}">

        Đăng xuất thành công.

    </div>


    <!-- ========================= -->
    <!-- FORM LOGIN -->
    <!-- ========================= -->
    <form th:action="@{/login}" method="post">

        <input type="text"
               name="username"
               placeholder="Tên đăng nhập"
               required>

        <input type="password"
               name="password"
               placeholder="Mật khẩu"
               required>

        <button type="submit">

            Đăng nhập

        </button>

    </form>


    <p class="link-text">

        Chưa có tài khoản?

        <a th:href="@{/register}">

            Đăng ký

        </a>

    </p>

</div>

</body>
</html>
