<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head('Đăng ký','auth.css')}"></head>

<body>

<div class="auth-wrapper">

    <!-- LEFT -->
    <div class="auth-left">

        <div class="overlay"></div>

        <div class="hospital-content">

            <div class="hospital-logo">
                +
            </div>

            <h1>K24 Hospital Portal</h1>

            <p>
                Tạo tài khoản để đặt lịch khám,
                xem lịch sử bệnh án và theo dõi
                đơn thuốc nhanh chóng.
            </p>

            <div class="hospital-features">

                <div class="feature-item">
                    Khám bệnh trực tuyến
                </div>

                <div class="feature-item">
                    Đặt lịch dễ dàng
                </div>

                <div class="feature-item">
                    Bảo mật thông tin
                </div>

            </div>

        </div>

    </div>

    <!-- RIGHT -->
    <div class="auth-right">

        <div class="auth-card">

            <div class="mobile-logo">
                +
            </div>

            <h2>Đăng ký</h2>

            <p class="subtitle">
                Tạo tài khoản bệnh nhân
            </p>

            <!-- EXIST -->
            <div th:if="${param.exists}"
                 class="alert error">

                Tên đăng nhập đã tồn tại.
            </div>

            <form th:action="@{/register}"
                  method="post"
                  th:object="${user}">

                <div class="input-group">

                    <label>Tên đăng nhập</label>

                    <input type="text"
                           th:field="*{username}"
                           placeholder="Tên đăng nhập">
                    <span class="text-danger" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></span>

                </div>

                <div class="input-group">

                    <label>Email</label>

                    <input type="email"
                           th:field="*{email}"
                           placeholder="Nhập email">
                    <span class="text-danger" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>

                </div>

                <div class="input-group">

                    <label>Mật khẩu</label>

                    <input type="password"
                           th:field="*{password}"
                           placeholder="Nhập mật khẩu">
                    <span class="text-danger" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></span>

                </div>

                <button type="submit">

                    Đăng ký

                </button>

            </form>

            <p class="link-text">

                Đã có tài khoản?

                <a th:href="@{/login}">
                    Đăng nhập
                </a>

            </p>

        </div>

    </div>

</div>

</body>
</html>
