<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<body>

<nav th:fragment="navbar(title)">

    <div class="navbar">

        <div class="navbar-left">
            <h2 th:text="${title}"></h2>
        </div>

        <div class="navbar-right">

            <form th:action="@{/logout}" method="post">

                <button class="logout-btn" type="submit">
                    Đăng xuất
                </button>

            </form>

        </div>

    </div>

</nav>

</body>
</html>
